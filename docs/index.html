<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="VoiceLatte / OpenVoiceText — 無料で、有料級の音声入力体験を。AIと一緒に育てるオープンソースプロジェクト。" />
  <meta name="theme-color" content="#ffffff" />
  <title>VoiceLatte / OpenVoiceText</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --soft: #f6f8fa;
      --link: #0969da;
      --code: #f6f8fa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --soft: #161b22;
        --link: #58a6ff;
        --code: #161b22;
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", Helvetica, Arial, sans-serif;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 14px;
    }

    .topbar strong { white-space: nowrap; }

    .topbar a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 42px 24px 80px;
    }

    .sync-note {
      color: var(--muted);
      font-size: 13px;
    }

    #content > :first-child { margin-top: 0; }

    h1, h2, h3, h4, h5, h6 {
      line-height: 1.25;
      margin-top: 1.8em;
      margin-bottom: .7em;
      scroll-margin-top: 72px;
    }

    h1, h2 {
      padding-bottom: .3em;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 2em; }
    h2 { font-size: 1.5em; }
    h3 { font-size: 1.25em; }

    p, ul, ol, blockquote, pre, table { margin-top: 0; margin-bottom: 16px; }

    a { color: var(--link); }
    a:hover { text-decoration-thickness: 2px; }

    img, video {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    hr {
      height: 1px;
      padding: 0;
      margin: 28px 0;
      background: var(--border);
      border: 0;
    }

    code {
      padding: .15em .35em;
      border-radius: 6px;
      background: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 85%;
    }

    pre {
      overflow: auto;
      padding: 16px;
      border-radius: 10px;
      background: var(--code);
      border: 1px solid var(--border);
    }

    pre code { padding: 0; background: transparent; font-size: 90%; }

    blockquote {
      padding: 0 1em;
      margin-left: 0;
      color: var(--muted);
      border-left: .25em solid var(--border);
    }

    table {
      width: 100%;
      border-spacing: 0;
      border-collapse: collapse;
      display: block;
      overflow: auto;
    }

    th, td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    tr:nth-child(2n) { background: var(--soft); }

    details {
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    summary { cursor: pointer; font-weight: 600; }

    .error {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--soft);
    }

    @media (max-width: 640px) {
      main { padding: 28px 18px 64px; }
      .topbar-inner { padding: 9px 16px; }
      .sync-note { display: none; }
      h1 { font-size: 1.7em; }
      h2 { font-size: 1.35em; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <strong>OpenVoiceText</strong>
      <span class="sync-note">README.md と自動同期</span>
      <a href="https://github.com/hibachi-inc/OpenVoiceText" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </header>

  <main>
    <article id="content" aria-live="polite">READMEを読み込んでいます…</article>
  </main>

  <script>
    const REPO = 'https://github.com/hibachi-inc/OpenVoiceText';
    const RAW_ROOT = 'https://raw.githubusercontent.com/hibachi-inc/OpenVoiceText/main/';
    const README_URL = RAW_ROOT + 'README.md';
    const content = document.getElementById('content');

    function isAbsolute(value) {
      return /^(?:[a-z]+:)?\/\//i.test(value) || value.startsWith('data:') || value.startsWith('mailto:');
    }

    function slugify(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function fixRenderedContent(root) {
      const usedIds = new Map();

      root.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
        const base = slugify(heading.textContent) || 'section';
        const count = usedIds.get(base) || 0;
        usedIds.set(base, count + 1);
        heading.id = count === 0 ? base : `${base}-${count}`;
      });

      root.querySelectorAll('img[src], video[src], source[src]').forEach((node) => {
        const src = node.getAttribute('src');
        if (!src || isAbsolute(src)) return;
        node.setAttribute('src', RAW_ROOT + src.replace(/^\.\//, '').replace(/^\//, ''));
      });

      root.querySelectorAll('a[href]').forEach((link) => {
        const href = link.getAttribute('href');
        if (!href) return;

        if (href.startsWith('#')) {
          return;
        }

        if (!isAbsolute(href)) {
          link.href = `${REPO}/blob/main/${href.replace(/^\.\//, '').replace(/^\//, '')}`;
        }

        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      });
    }

    async function renderReadme() {
      try {
        const response = await fetch(`${README_URL}?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`READMEの取得に失敗しました (${response.status})`);

        const markdown = await response.text();
        marked.setOptions({ gfm: true, breaks: false });
        content.innerHTML = marked.parse(markdown);
        fixRenderedContent(content);

        if (location.hash) {
          requestAnimationFrame(() => {
            document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
          });
        }
      } catch (error) {
        content.innerHTML = `
          <div class="error">
            <strong>READMEを読み込めませんでした。</strong><br>
            <span>${String(error.message || error)}</span><br><br>
            <a href="${REPO}" target="_blank" rel="noopener noreferrer">GitHubでREADMEを見る ↗</a>
          </div>`;
      }
    }

    renderReadme();
  </script>
</body>
</html>
