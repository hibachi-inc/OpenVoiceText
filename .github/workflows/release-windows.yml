name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: VoiceLatte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VoiceLatte/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --ci --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLatte-${{ env.RELEASE_VERSION }}-windows
          path: |
            VoiceLatte/src-tauri/target/release/bundle/nsis/*.exe
            VoiceLatte/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
