name: version-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          [ "$pkg" = "$tauri" ] && [ "$pkg" = "$cargo" ] || { echo "version mismatch"; exit 1; }

  sensitive-lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sensitive-app lists match (TS/Swift)
        run: node scripts/check-sensitive-lists.mjs
