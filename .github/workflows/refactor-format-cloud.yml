name: format-cloud-once

on:
  push:
    branches: [refactor/modularize-app]
    paths:
      - scripts/refactor-format-cloud-trigger.txt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-app
      - name: Format split Rust sources
        run: rustfmt --edition 2021 src-tauri/src/cloud.rs src-tauri/src/cloud/*.rs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: format split cloud modules" || true
          git push origin HEAD:refactor/modularize-app
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
