name: split-cloud-once

on:
  push:
    branches: [refactor/modularize-app]
    paths:
      - scripts/refactor-split-cloud.mjs
      - scripts/refactor-cloud-trigger.txt

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Split cloud implementation
        run: node scripts/refactor-split-cloud.mjs
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "refactor: split Rust cloud implementation" || exit 0
          git push origin HEAD:refactor/modularize-app
      - name: Parse and format Rust files
        run: |
          rustfmt --edition 2021 src-tauri/src/cloud.rs src-tauri/src/cloud/*.rs
          git diff --exit-code
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
