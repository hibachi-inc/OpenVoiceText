name: refactor-final-verify

on:
  push:
    branches: [refactor/modularize-app]
    paths:
      - scripts/refactor-final-verify-trigger.txt

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run text tests
        run: npm run test:text
      - name: Check sensitive list synchronization
        run: node scripts/check-sensitive-lists.mjs
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
