name: clean-recording-once

on:
  push:
    branches: [refactor/modularize-app]
    paths:
      - scripts/refactor-clean-recording-imports.mjs
      - scripts/refactor-clean-recording-trigger.txt

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refactor-clean-recording-imports.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: clean recording extraction imports" || exit 0
          git push origin HEAD:refactor/modularize-app
      - run: npm run build
      - run: npm run test:text
